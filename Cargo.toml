[workspace]
resolver = "2"
members = [
    "protocol",
    "client",
    "proxy",
    "client-gui",
]

[workspace.package]
version = "1.11.4"
edition = "2021"
authors = ["ShibbityShwab"]
license = "LicenseRef-LightSpeed-NC-1.1"
repository = "https://github.com/ShibbityShwab/lightspeed"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Networking
bytes = "1.12"

# Serialization / Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging / Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Internal crates
lightspeed-protocol = { path = "protocol" }

# Time: replaces the unmaintained crate from RUSTSEC-2026-0543 (unconditional
# dependency of both shipped binaries). `formatting` renders the UTC process
# timestamps, `local-offset` resolves the local wall clock for the ML
# time-of-day features (with a documented UTC fallback), and `macros` builds
# the format descriptions at compile time.
time = { version = "0.3", features = ["std", "formatting", "local-offset", "macros"] }

# cargo-dist release build profile.
[profile.dist]
inherits = "release"
lto = "thin"