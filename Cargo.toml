[workspace]
members = ["client", "proxy", "protocol", "client-gui"]
resolver = "2"

[workspace.package]
version = "0.5.1"
edition = "2021"
authors = ["LightSpeed Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }

# Use the latest stable rustc for CI (keep in sync with .github/workflows)
# MSRV: 1.75 (for workspace resolver v2)