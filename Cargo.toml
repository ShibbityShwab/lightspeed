[workspace]
resolver = "2"
members = [
    "protocol",
    "client",
    "proxy",
    "client-gui",
]

[workspace.package]
version = "1.2.0"
edition = "2021"
authors = ["LightSpeed Contributors"]
license = "LicenseRef-LightSpeed-NC-1.0"
repository = "https://github.com/ShibbityShwab/lightspeed"
description = "Zero-cost global network optimizer — reduce and stabilize ping for multiplayer games"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }

# Networking
bytes = "1.12"

# Serialization / Config
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging / Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Internal crates
lightspeed-protocol = { path = "protocol" }

# Time
chrono = { version = "0.4", features = ["serde"] }

# cargo-dist release build profile.
[profile.dist]
inherits = "release"
lto = "thin"