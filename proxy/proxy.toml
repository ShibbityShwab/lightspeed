# LightSpeed Proxy — Default Configuration
# Override by mounting your own proxy.toml or setting CLI flags.

[server]
node_id     = "proxy-dev"
region      = "local"
max_clients = 100

[security]
# NOTE: require_auth = true requires BOTH (a) the proxy built with `--features quic`
# (so the control plane runs) AND (b) a client that stamps the session token into
# data-plane packets. The current client does not stamp tokens, so `true` would
# reject every legitimate client. Left `false` by default until that lands.
require_auth                = false
max_amplification_ratio     = 2.0
max_destinations_per_window = 10
ban_duration_secs           = 3600

[rate_limit]
max_pps_per_client = 1000
max_bps_per_client = 1000000
max_connections    = 200

[metrics]
enabled       = true
interval_secs = 10
