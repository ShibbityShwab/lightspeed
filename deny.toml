# cargo-deny v2 configuration for LightSpeed
#
# Advisory allowlist policy (see docs/security-advisory-review-2026-11-18.md):
# every ignored advisory needs a reason and the dependency path it covers, and
# the list is re-reviewed quarterly and whenever the Security Audit workflow
# fails. Remove an entry when its advisory is withdrawn or the crate leaves the
# dependency graph. Last reviewed 2026-11-18; next review due 2027-02-18.
[advisories]
yanked = "warn"
ignore = [
  # -- build-time macro crates, never compiled in a shipped target -----------
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained; build-time macro reached only via tray-icon's Linux-only gtk3-macros/glib-macros path, while tray-icon is a Windows-only dep of lightspeed-gui, so it is never compiled; no patched release" },
  { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; macro-only crate reached via argmin under the client's optional `ml` feature (CI feature matrix only, not shipped); zero runtime code" },
  # -- unmaintained crates with no safe upgrade path -------------------------
  { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained; v1.3.3 is considered complete by upstream and has no security finding; reached only through the client's optional `ml` feature and used to decode local model files, not network input" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; reached only through winit/sctk-adwaita window-decoration title text in the Linux GUI build and the client-gui font-coverage dev-dependency, no network-facing code; removal needs an upstream sctk-adwaita/winit change" },
  # -- zvariant/zbus_names moved into zbus 6; Linux accessibility stack ------
  { id = "RUSTSEC-2026-0370", reason = "zvariant consolidating into zbus 6; Linux-only accessibility stack via eframe/accesskit_unix, no network surface; removal blocked on an eframe/accesskit upgrade" },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names consolidating into zbus 6; Linux-only accessibility stack via eframe/accesskit_unix, no network surface; removal blocked on an eframe/accesskit upgrade" },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive consolidating into zbus 6; build-time derive for the Linux accessibility stack; removal blocked on an eframe/accesskit upgrade" },
  # -- direct deps that are unmaintained: informational, no patched release ---
  { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained (informational; no memory-safety finding); used for wall-clock timestamps and the ML time-of-day features; migration to jiff/time scoped in docs/security-advisory-review-2026-11-18.md" },
]

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib",
  # LightSpeed custom license (workspace crates)
  "LicenseRef-LightSpeed-NC-1.1",
  # Unicode / ICU -- idna/url/webbrowser chain (GUI only)
  "Unicode-3.0",         # icu_collections, icu_locale_core, icu_normalizer, etc.
  # GUI crate additional licenses:
  "BSL-1.0",             # clipboard-win, error-code (arboard -> egui-winit chain)
  "OFL-1.1",             # epaint_default_fonts (egui embedded fonts)
  "MPL-2.0",             # option-ext (dirs -> tray-icon chain)
  # WinDivert (kernel-level packet filter) -- LGPL-3.0, used only in lightspeed-client
  "LGPL-3.0-or-later",   # windivert, windivert-sys
  # webpki-root-certs (TLS trust anchors, bundled in binary)
  "CDLA-Permissive-2.0",
  "CC0-1.0",             # hexf-parse (naga -> wgpu -> egui chain, GUI only)
  "Ubuntu-font-1.0",    # epaint_default_fonts (egui embedded fonts)
]

[bans]
multiple-versions = "warn"
wildcards         = "allow"
deny = []
skip = [
  { name = "syn" }, { name = "windows-sys" }, { name = "windows-targets" },
  { name = "windows_x86_64_msvc" }, { name = "windows_x86_64_gnu" },
  { name = "windows_aarch64_msvc" }, { name = "windows_i686_msvc" },
  { name = "windows_i686_gnu" }, { name = "hashbrown" }, { name = "redox_syscall" },
]

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
