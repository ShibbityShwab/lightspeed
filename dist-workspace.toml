# cargo-dist configuration for LightSpeed.
# Docs: https://opensource.axo.dev/cargo-dist/

[workspace]
# Point cargo-dist at the Cargo workspace in this directory.
members = ["cargo:."]

[dist]
# The cargo-dist version this config targets.
cargo-dist-version = "0.32.0"
# GitHub Actions CI: produce installers + free Sigstore attestations.
ci = ["github"]
# Platform installers. No deb/rpm (cargo-dist does not support them);
# Homebrew is a possible follow-up (requires a tap).
installers = ["shell", "powershell", "msi"]
# Release targets: client + proxy for all four; the GUI is overridden
# per-package (it has no macOS platform module).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
# Free Sigstore/GitHub attestations (no code-signing certs needed).
github-attestations = true
# No per-asset checksum files (Sigstore attestations cover integrity). This also
# drops the unified sha256.sum, which cargo-dist 0.32 cannot produce independently.
checksum = "false"
# dist's own uploaded source tarball is redundant with GitHub's auto-generated one.
source-tarball = false
# main.wxs for the client is hand-edited to bundle WinDivert.dll + WinDivert64.sys
# into the MSI (cargo-dist's `include` only populates archives, not MSIs).
allow-dirty = ["msi"]

# Linux system packages for the build jobs. libpcap-dev is for the client's
# pcap-capture feature; the rest are the eframe/winit GUI build deps (X11,
# keyboard, OpenGL/glutin, GTK file dialogs).
[dist.dependencies.apt]
libpcap-dev = "*"
libxkbcommon-dev = "*"
libxkbcommon-x11-0 = "*"
libxcb1-dev = "*"
libxcb-render0-dev = "*"
libxcb-shape0-dev = "*"
libxcb-xfixes0-dev = "*"
libgl1-mesa-dev = "*"
libgtk-3-dev = "*"
