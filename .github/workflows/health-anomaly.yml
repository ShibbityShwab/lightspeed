name: Health Anomaly Monitor

# Fleet degradation monitor that the liveness check cannot replace.
# health-monitor.yml proves a relay serves /health and can register a
# client right now; it cannot see a relay that is up but silently
# relaying nothing, rejecting every auth while creating no sessions, or
# drifting behind the fleet version (the 1.6.3 outage ran ~12h with
# health checks green). This job reads the collector history off the
# stats branch, the registry, and each relay's /health, then alerts to
# Discord and fails the run on any anomaly.
#
# health-anomaly.sh owns the Discord alert (it includes the one-line
# evidence for each anomaly); this workflow only supplies the webhook
# and fails the run, exactly like health-monitor.yml fails on failure.

on:
  schedule:
    # Hourly, offset from the liveness monitor's :00/:30 runs.
    - cron: '20 * * * *'
  workflow_dispatch:

concurrency:
  group: health-anomaly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  anomaly:
    name: Detect fleet anomalies
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch collector history from the stats branch
        # The stats branch is written by pages.yml on an hourly cron. A
        # missing branch or file is not an anomaly by itself: the monitor
        # degrades to the registry + /health detectors only. But a history
        # that EXISTS and is FROZEN is an anomaly - on 2026-10-01 the Pages
        # schedule quietly stopped firing at 01:46Z while this job kept
        # reporting "no anomalies" against 5-hour-old data, so the stale_history
        # detector (see infra/scripts/health-anomaly.sh) now fails the run when
        # the newest snapshot is older than the limit passed below.
        run: |
          set -uo pipefail
          mkdir -p .stats
          if git fetch origin stats --depth=1 2>/dev/null; then
            git show origin/stats:web/network-history.json > .stats/network-history.json 2>/dev/null \
              || echo '{"version":1,"generated_at":0,"snapshots":[]}' > .stats/network-history.json
          else
            echo '{"version":1,"generated_at":0,"snapshots":[]}' > .stats/network-history.json
          fi
          echo "history: $(jq -r '.snapshots | length' .stats/network-history.json) snapshot(s)"

      - name: Self-test the detectors
        run: bash infra/scripts/test_health_anomaly.sh

      - name: Detect fleet anomalies
        # Exits non-zero (and posts the evidence to Discord when the
        # webhook is set) if any detector fires.
        #
        # --max-staleness is set to 3h explicitly: the collector runs hourly,
        # so a newest snapshot older than that means the pipeline stopped and
        # every other detector is describing a frozen past. An absent history
        # is not stale (it has no snapshots to age), which is what keeps a
        # first run or a fresh stats branch from failing.
        run: |
          # Resolve the newest SOFTWARE release so a fleet that silently missed a
          # deploy is caught. version_lag compares relays against each other, so
          # a uniformly stale fleet raises nothing.
          #
          # Not /releases/latest: that returns whatever was published most
          # recently, which here includes data-only tags like geoip-2026-10.
          # Filter to semver tags, newest first.
          #
          # Best-effort - an API hiccup must not become a false alarm, so an
          # unresolved tag skips the check (the detector treats "" as unset).
          EXPECT="$(curl -fsS --max-time 20 \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
            | jq -r '[.[].tag_name | select(test("^v?[0-9]+\\.[0-9]+\\.[0-9]+$"))][0] // ""' \
            2>/dev/null | sed 's/^v//' || true)"
          if [ -n "$EXPECT" ]; then
            echo "expecting fleet release: $EXPECT"
          else
            echo "could not resolve the newest release; skipping the release-lag check"
          fi
          bash infra/scripts/health-anomaly.sh \
            --history .stats/network-history.json \
            --max-staleness 10800 \
            --expect-version "$EXPECT"
