name: Sync Wiki

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync docs/ → GitHub Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Sync to Wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          WIKI_REMOTE="github.com/${REPO}.wiki.git"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"

          clone_wiki() {
            rm -rf wiki-repo
            git clone "https://x-access-token:$1@${WIKI_REMOTE}" wiki-repo
          }

          # The default GITHUB_TOKEN cannot push to `<repo>.wiki.git`, and a
          # fine-grained PAT cannot reach a wiki at all - the cause of the 403s
          # from 2026-08-03. Only a classic PAT with `repo` scope works.
          if [ -z "${WIKI_TOKEN:-}" ] || ! clone_wiki "$WIKI_TOKEN"; then
            echo "::warning::WIKI_TOKEN cannot reach the wiki; trying GITHUB_TOKEN"
            if ! clone_wiki "${GITHUB_TOKEN:-}"; then
              echo "::error::No usable wiki credential. Set WIKI_TOKEN to a classic PAT with 'repo' scope."
              exit 1
            fi
          fi

          python scripts/sync-wiki.py "$REPO" wiki-repo

          cd wiki-repo
          if git diff --quiet && git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git add -A
          git commit -m "Sync docs/ from ${GITHUB_SHA::7}"
          git push origin HEAD:master
          echo "Wiki updated."
