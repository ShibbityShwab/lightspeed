name: Sync Wiki

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
  workflow_dispatch:

jobs:
  sync:
    name: Sync docs/ → GitHub Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Sync to Wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Clone wiki using gh CLI (pre-installed, handles auth)
          gh repo clone "${{ github.repository }}.wiki" wiki-repo 2>/dev/null || {
            echo "Initializing wiki..."
            mkdir wiki-repo && cd wiki-repo
            git init && git checkout -b master
            echo "# LightSpeed Wiki" > Home.md
            git add Home.md && git commit -m "init"
            git remote add origin "https://${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git"
            git push -u origin master --force
            cd .. && rm -rf wiki-repo
            gh repo clone "${{ github.repository }}.wiki" wiki-repo
          }

          cd wiki-repo

          # Remove old pages
          find . -name "*.md" ! -name "_*" -delete 2>/dev/null || true

          # Copy all docs pages
          for f in ../docs/*.md; do
            base=$(basename "$f")
            sed 's|\.md)|)|g' "$f" > "$base"
            git add "$base"
          done

          # Copy archive
          mkdir -p archive
          for f in ../docs/archive/*.md; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            sed 's|\.md)|)|g' "$f" > "archive/$base"
            git add "archive/$base"
          done

          # Push
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Sync docs/"
            git push origin master
            echo "Wiki updated!"
          fi
