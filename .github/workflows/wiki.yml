name: Sync Wiki

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync docs/ → GitHub Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Sync to Wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          WIKI_REMOTE="github.com/${REPO}.wiki.git"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"

          clone_wiki() {
            rm -rf wiki-repo
            git clone -q "https://x-access-token:$1@${WIKI_REMOTE}" wiki-repo
          }

          # Cloning a public wiki needs no credentials at all, so a successful
          # clone says nothing about write access - probe the push itself.
          can_push() {
            [ -n "$1" ] || return 1
            clone_wiki "$1" 2>/dev/null || return 1
            git -C wiki-repo push --dry-run origin HEAD:master >/dev/null 2>&1
          }

          # The default GITHUB_TOKEN cannot push to `<repo>.wiki.git`, and a
          # fine-grained PAT cannot reach a wiki at all - the cause of the 403s
          # from 2026-08-03. Only a classic PAT with `repo` scope works.
          if can_push "${WIKI_TOKEN:-}"; then
            echo "Using WIKI_TOKEN."
          elif can_push "${GITHUB_TOKEN:-}"; then
            echo "::warning::WIKI_TOKEN cannot push to the wiki; using GITHUB_TOKEN."
          else
            echo "::error::No usable wiki credential. Set WIKI_TOKEN to a classic PAT with 'repo' scope (fine-grained PATs cannot access wikis)."
            exit 1
          fi

          python scripts/sync-wiki.py "$REPO" wiki-repo

          cd wiki-repo
          if git diff --quiet && git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git add -A
          git commit -m "Sync docs/ from ${GITHUB_SHA::7}"
          git push origin HEAD:master
          echo "Wiki updated."
