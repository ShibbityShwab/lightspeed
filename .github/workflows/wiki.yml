name: Sync Wiki

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync docs/ → GitHub Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync to Wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          WIKI_URL="https://x-access-token:${WIKI_TOKEN}@github.com/${{ github.repository }}.wiki.git"

          # Try to clone wiki repo; initialize if it doesn't exist
          if git clone "$WIKI_URL" wiki-repo 2>/dev/null; then
            echo "Wiki repo cloned"
          else
            echo "Initializing wiki..."
            mkdir wiki-repo && cd wiki-repo
            git init && git checkout -b master
            echo "# LightSpeed Wiki" > Home.md
            git add Home.md && git commit -m "init"
            git remote add origin "$WIKI_URL"
            git push -u origin master --force || echo "Push failed - wiki may need to be enabled in repo Settings > Features"
            cd .. && rm -rf wiki-repo
            git clone "$WIKI_URL" wiki-repo || echo "Wiki clone failed - enable Wiki in repo Settings"
          fi

          if [ -d wiki-repo ]; then
            cd wiki-repo
            find . -name "*.md" ! -name "_*" -delete 2>/dev/null || true
            for f in ../docs/*.md; do
              base=$(basename "$f")
              sed 's|\.md)|)|g' "$f" > "$base"
              git add "$base"
            done
            mkdir -p archive
            for f in ../docs/archive/*.md; do
              [ -f "$f" ] || continue
              base=$(basename "$f")
              sed 's|\.md)|)|g' "$f" > "archive/$base"
              git add "archive/$base"
            done
            if git diff --staged --quiet; then
              echo "No changes"
            else
              git commit -m "Sync docs/ @ ${{ github.sha }}"
              git push origin master || echo "Push failed - set WIKI_TOKEN secret with a PAT"
            fi
          fi
