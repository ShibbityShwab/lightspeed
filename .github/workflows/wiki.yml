name: Sync Wiki

on:
  workflow_dispatch:

jobs:
  sync:
    name: Sync docs/ → GitHub Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Sync to Wiki
        env:
          TOKEN: ${{ secrets.WIKI_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "WIKI_TOKEN not set - skipping wiki sync."
            echo "Add a PAT with repo scope to Settings > Secrets > Actions > WIKI_TOKEN"
            echo "Or push manually: git clone https://github.com/${{ github.repository }}.wiki.git"
            exit 0
          fi

          REPO="${{ github.repository }}"
          WIKI_URL="https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"

          git clone "$WIKI_URL" wiki-repo 2>/dev/null || {
            mkdir wiki-repo && cd wiki-repo
            git init && git checkout -b master
            echo "# LightSpeed Wiki" > Home.md
            git add Home.md && git commit -m "init"
            git remote add origin "$WIKI_URL"
            git push -u origin master
            cd .. && rm -rf wiki-repo
            git clone "$WIKI_URL" wiki-repo
          }

          cd wiki-repo
          find . -name "*.md" ! -name "_Footer.md" ! -name "_Sidebar.md" -delete

          for f in ../docs/*.md; do
            base=$(basename "$f")
            sed 's|\.md)|)|g' "$f" > "$base"
            git add "$base"
          done

          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Sync docs/"
            git push origin master
            echo "Wiki updated!"
          fi
