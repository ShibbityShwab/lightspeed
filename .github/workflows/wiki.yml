name: Sync Wiki

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync docs/ → GitHub Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Sync to Wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          WIKI_REMOTE="github.com/${REPO}.wiki.git"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"

          # Cloning a public wiki needs no credentials, so neither the clone nor a
          # dry-run of an up-to-date branch proves anything about write access.
          # The real push is the only reliable test, so it is also the probe.
          rm -rf wiki-repo
          git clone -q "https://github.com/${REPO}.wiki.git" wiki-repo

          python scripts/sync-wiki.py "$REPO" wiki-repo

          cd wiki-repo
          if git diff --quiet && git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git add -A
          git commit -q -m "Sync docs/ from ${GITHUB_SHA::7}"

          push_with() {
            [ -n "$1" ] || return 1
            git remote set-url origin "https://x-access-token:$1@${WIKI_REMOTE}"
            git push -q origin HEAD:master
          }

          # The default GITHUB_TOKEN has historically not been able to push to a
          # `.wiki.git`, and a fine-grained PAT cannot reach a wiki at all - the
          # cause of the 403s from 2026-08-03. Only a classic PAT with `repo`
          # scope is guaranteed to work.
          if push_with "${WIKI_TOKEN:-}"; then
            echo "Pushed with WIKI_TOKEN."
          elif push_with "${GITHUB_TOKEN:-}"; then
            echo "::warning::Pushed with GITHUB_TOKEN; WIKI_TOKEN cannot write to the wiki."
          else
            echo "::error::No usable wiki credential. Set WIKI_TOKEN to a classic PAT with 'repo' scope (fine-grained PATs cannot access wikis)."
            exit 1
          fi
