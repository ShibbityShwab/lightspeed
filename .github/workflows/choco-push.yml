name: Choco Push

# Push the Chocolatey package at its current version to the community feed.
#
# The release workflow's bump-chocolatey job pushes on new tags, but a tag
# created before CHOCO_API_KEY existed (v1.6.14) was bumped without a push,
# which left the feed serving 1.6.3 while the repo shipped 1.6.14. This job
# exists so that gap - and any future one - is a one-click dispatch instead of
# a code change.
#
# Pushes are moderated: the API accepting the package is the success signal;
# the listing stays unlisted until a Chocolatey moderator approves it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to push (must match the nuspec), e.g. 1.6.14"
        required: true
        type: string

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - name: Verify the nuspec matches the requested version
        shell: bash
        run: |
          SPEC_VERSION="$(sed -n 's:.*<version>\([^<]*\)</version>.*:\1:p' dist/chocolatey/lightspeed.nuspec | head -1)"
          if [ "$SPEC_VERSION" != "${{ inputs.version }}" ]; then
            echo "::error::nuspec is ${SPEC_VERSION}, requested ${{ inputs.version }}"
            exit 1
          fi

      - name: Build the nupkg
        shell: bash
        run: bash dist/chocolatey/build.sh

      - name: Push to the community feed
        if: ${{ env.CHOCO_API_KEY != '' }}
        shell: bash
        run: |
          nupkg="$(ls dist/chocolatey/lightspeed.*.nupkg | head -1)"
          echo "pushing $nupkg"
          curl -fsS -X PUT \
            -H "X-NuGet-ApiKey: ${CHOCO_API_KEY}" \
            --data-binary "@${nupkg}" \
            https://push.chocolatey.org/api/v2/package/ \
            -o /dev/null -w 'push HTTP %{http_code}\n'

      - name: Note the secret is absent
        if: ${{ env.CHOCO_API_KEY == '' }}
        shell: bash
        run: echo "::notice::CHOCO_API_KEY is not set; nothing was pushed."
