name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

concurrency:
  group: pages
  cancel-in-progress: true

# Least privilege by default. Jobs below widen only what they need:
# snapshot pushes history -> contents: write; deploy publishes -> pages/id-token.
permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch prior history
        run: |
          git fetch origin stats --depth=1 || true
          mkdir -p .stats
          (git show origin/stats:web/network-history.json > .stats/history.json 2>/dev/null || echo '{"version":1,"generated_at":0,"snapshots":[]}' > .stats/history.json)
          # Prior placement recommendation carries stability.runs for the
          # recommender's hysteresis gate. An empty object means "no history".
          (git show origin/stats:web/placement.json > .stats/placement.json 2>/dev/null || echo '{}' > .stats/placement.json)

      - name: Generate live network stats
        run: bash infra/scripts/network-stats.sh

      - name: Collect live relay metrics history
        # collect-metrics.sh always exits 0 and always writes valid JSON, even
        # when a relay is unreachable; tolerate a collector regression too so a
        # single bad relay can never fail the Pages deploy.
        continue-on-error: true
        run: |
          set -uo pipefail
          mkdir -p web
          # Seed the collector from the history fetched off the stats branch so
          # the bounded snapshots accumulate across runs. collect-metrics.sh
          # reads and overwrites this path in place.
          cp .stats/history.json web/network-history.json 2>/dev/null \
            || echo '{"version":1,"generated_at":0,"snapshots":[]}' > web/network-history.json
          bash infra/scripts/collect-metrics.sh web/network-history.json || true

      - name: Recommend relay regions
        # The recommender always exits 0 and always writes valid JSON. It is
        # advisory only: it never provisions or moves infrastructure, and it
        # writes to .stats/ so the recommendation stays off the public Pages
        # artifact (it lives only on the stats branch).
        continue-on-error: true
        run: |
          set -uo pipefail
          bash infra/scripts/recommend-regions.sh \
            --history web/network-history.json \
            --previous .stats/placement.json \
            --registry web/registry.json \
            --geo-dir infra/geo \
            --out .stats/placement.json

      - name: Commit history to stats branch
        continue-on-error: true
        run: |
          set -euo pipefail

          git config user.name "lightspeed-bot"
          git config user.email "actions@users.noreply.github.com"

          WORKTREE="$(mktemp -d)"
          git worktree add --detach "$WORKTREE"

          pushd "$WORKTREE"
          if git show-ref --verify --quiet refs/remotes/origin/stats; then
            git checkout -B stats origin/stats
          else
            # First run: the orphan stats branch does not exist yet.
            # --orphan keeps the current index, so clear it or the first
            # stats commit would contain the whole main tree.
            git checkout --orphan stats
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi

          mkdir -p web
          cp "$GITHUB_WORKSPACE/web/network-history.json" web/network-history.json
          # These files are gitignored in the main tree (so local runs stay
          # clean), so force-add them here or the commit step aborts and the
          # history never accumulates on the stats branch.
          git add -f web/network-history.json

          if [ -f "$GITHUB_WORKSPACE/.stats/placement.json" ]; then
            cp "$GITHUB_WORKSPACE/.stats/placement.json" web/placement.json
            git add -f web/placement.json
          fi

          if git diff --cached --quiet; then
            echo "No history changes to commit"
            popd
            git worktree remove --force "$WORKTREE" || true
            exit 0
          fi

          git commit -m "chore: update network history and placement snapshot"

          pushed=0
          for attempt in 1 2 3; do
            if git push origin HEAD:stats; then
              echo "Pushed stats branch on attempt $attempt"
              pushed=1
              break
            fi

            echo "Push attempt $attempt failed; syncing with origin/stats"
            git fetch origin stats --depth=1 || true
            if ! git rev-parse --verify --quiet refs/remotes/origin/stats >/dev/null; then
              continue
            fi

            if ! git rebase refs/remotes/origin/stats; then
              # Both runs appended a snapshot to the same JSON document, so a
              # conflict is expected. During a rebase "theirs" is our freshly
              # generated document; keep it and finish the replay.
              git checkout --theirs -- web/network-history.json web/placement.json 2>/dev/null || true
              git add web/network-history.json
              if [ -f web/placement.json ]; then
                git add web/placement.json
              fi
              GIT_EDITOR=true git rebase --continue || git rebase --abort || true
            fi
          done

          popd
          git worktree remove --force "$WORKTREE" || true

          if [ "$pushed" -ne 1 ]; then
            echo "Failed to push stats branch after 3 attempts" >&2
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: snapshot
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
