name: Benchmarks

# Regression benchmarks are a release gate, not a per-push gate: a criterion
# run is ~16 minutes on its own, which was 99% of the CI critical path for a
# suite that cannot regress on a docs change. Run them when a release tag is
# pushed, and on demand when a performance question needs an answer.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark-regression:
    name: Benchmark Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install critcmp
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: critcmp

      - name: Run benchmarks (report only)
        run: cargo bench --workspace --exclude lightspeed-gui

      - name: Upload benchmark results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-results
          path: target/criterion/
          retention-days: 30
          if-no-files-found: warn
