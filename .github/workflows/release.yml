name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Build release binaries
        run: |
          cargo build --release -p lightspeed-client -p lightspeed-proxy
          strip target/release/lightspeed
          strip target/release/lightspeed-proxy

      - name: Package
        run: |
          mkdir -p release
          cp target/release/lightspeed release/
          cp target/release/lightspeed-proxy release/
          cp README.md CHANGELOG.md LICENSE release/
          cp -r docs/ release/docs/
          tar -czf lightspeed-linux-x86_64.tar.gz -C release .
          echo "ARTIFACT=lightspeed-linux-x86_64.tar.gz" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: lightspeed-linux-x86_64.tar.gz
          body: |
            ## LightSpeed ${{ github.ref_name }}

            ### Download
            - `lightspeed-linux-x86_64.tar.gz` — Client + Proxy binaries

            ### Quick Start
            ```bash
            tar xzf lightspeed-linux-x86_64.tar.gz
            ./lightspeed --demo
            sudo ./lightspeed --start-interceptor --game rust --proxy YOUR_PROXY:4434
            ```

            See [CHANGELOG.md](CHANGELOG.md) for full release notes.
          generate_release_notes: true