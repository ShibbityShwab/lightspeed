#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.
#
# This file is hand-edited on top of cargo-dist's output (dist-workspace.toml
# sets allow-dirty = ["ci"]). The hand edits are the release-publish hardening
# from 2026-11-17: the publish step is idempotent and retried
# (infra/scripts/publish-release.sh), the package bumps are gated on the
# published release instead of on the `host` job's status (`release-state`), a
# self-test runs on every event, and a read-only `workflow_dispatch` probe
# exists. The same round added the gated publishers for the remaining channels:
# `publish-scoop` (ShibbityShwab/scoop-bucket via SCOOP_TOKEN) and
# `publish-aur` (AUR via AUR_SSH_PRIVATE_KEY), plus their hermetic
# self-tests; channel state and owner-only blockers: docs/publishing-channels.md.
# Background and the manual fallback: docs/deploy-proxy.md, "Publishing a
# release".

name: Release
permissions:
  "contents": "write"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
# Various formats will be parsed into a VERSION and an optional PACKAGE_NAME, where
# PACKAGE_NAME must be the name of a Cargo package in your workspace, and VERSION
# must be a Cargo-style SemVer Version (must have at least major.minor.patch).
#
# If PACKAGE_NAME is specified, then the announcement will be for that
# package (erroring out if it doesn't have the given version or isn't dist-able).
#
# If PACKAGE_NAME isn't specified, then the announcement will be for all
# (dist-able) packages in the workspace with that version (this mode is
# intended for workspaces with only one dist-able package, or with all dist-able
# packages versioned/released in lockstep).
#
# If you push multiple tags at once, separate instances of this workflow will
# spin up, creating an independent announcement for each one. However, GitHub
# will hard limit this to 3 tags per commit, as it will assume more tags is a
# mistake.
#
# If there's a prerelease-style suffix to the version, then the release(s)
# will be marked as a prerelease.
on:
  pull_request:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  # Read-only probe: report the token/release state and what the publish step
  # would do, without publishing anything. A dispatch is never publishing:
  # `publishing` below is true only for a tag push, so the build and publish
  # jobs stay off. Used to verify a fix (and the self-test job) on a branch.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to inspect (for example v1.11.0). Empty = report only the token state.'
        required: false
        default: ''
        type: string
      run_bumps:
        description: 'Run the package/channel bumps for the tag above (an already-published release). Never builds or publishes a release.'
        required: false
        default: false
        type: boolean

jobs:
  # Run 'dist plan' (or host) to determine what tasks we need to do
  plan:
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      # A release is only ever planned and published from a tag push. This used
      # to be `!github.event.pull_request`, which made a workflow_dispatch count
      # as publishing and run `dist host --steps=create --tag=<branch>`. PRs and
      # dispatches now run `dist plan` only, so the publish jobs cannot run by
      # accident on either event.
      tag: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) && github.ref_name || '' }}
      tag-flag: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) && format('--tag={0}', github.ref_name)) || '' }}
      publishing: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        # we specify bash to get pipefail; it guards against the `curl` command
        # failing. otherwise `sh` won't catch that `curl` returned non-0
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      # Build the release plan (or the host manifest) for this event. Only a tag
      # push may plan a release; a pull_request and a workflow_dispatch both run
      # `dist plan`, which writes nothing to GitHub. The nested ternary is
      # cargo-dist's, kept because it also handles the fork case for PRs.
      - id: plan
        run: |
          dist ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && format('host --steps=create --tag={0}', github.ref_name)) || 'plan' }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Build and packages all the platform-specific things
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    # Let the initial task tell us to not run (currently very blunt)
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      # Target platforms/runners are computed by dist in create-release.
      # Each member of the matrix has the following arguments:
      #
      # - runner: the github runner
      # - dist-args: cli flags to pass to dist
      # - install-dist: expression to run to install dist on the runner
      #
      # Typically there will be:
      # - 1 "global" task that builds universal installers
      # - N "local" tasks that build each platform's binaries and platform-specific installers
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    permissions:
      "attestations": "write"
      "contents": "read"
      "id-token": "write"
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      # Get the dist-manifest
      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        run: |
          ${{ matrix.packages_install }}
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: "target/distrib/*${{ join(matrix.targets, ', ') }}*"
      - id: cargo-dist
        name: Post-build
        # We force bash here just because github makes it really hard to get values up
        # to "real" actions without writing to env-vars, and writing to env-vars has
        # inconsistent syntax between shell and powershell.
        shell: bash
        run: |
          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Build and package all the platform-agnostic(ish) things
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Get all the local artifacts for the global tasks to use (for e.g. checksums)
      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          # Parse out what we just built and upload it to scratch storage
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}
  # Determines if we should publish/announce
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    # Only run if we're "publishing", and only if plan, local and global didn't fail (skipped is fine)
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-22.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      # Fetch artifacts from scratch-storage
      - name: Fetch artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          # Overwrite the previous copy
          name: artifacts-dist-manifest
          path: dist-manifest.json
      # Create a GitHub Release while uploading all files to it.
      #
      # In cargo-dist 0.32's generated workflow the `dist host` step above only
      # produces the announcement manifest; the real GitHub write has always
      # happened here, through gh. That is why this block is the one that hit
      # the 2026-11-16 403, and why it can be made idempotent and retried
      # without touching cargo-dist's dist-manifest outputs.
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      # Idempotent publish: create when the release is missing, upload
      # --clobber when it already exists, bounded retry on a transient
      # 5xx/403, and an actionable permission verdict on a persistent 403.
      # --dry-run/skip logic lives in infra/scripts/publish-release.sh.
      - name: "Create or update the GitHub Release"
        id: publish
        env:
          # Prefer an explicit PAT only when GITHUB_TOKEN cannot write releases
          # in this repository; empty by default, so the Actions token is used.
          # See the RELEASE_TOKEN note in docs/deploy-proxy.md.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: "${{ needs.plan.outputs.tag }}"
          TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          PRERELEASE: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          set -euo pipefail
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"
          bash infra/scripts/publish-release.sh \
            --tag "$TAG" \
            --target "$RELEASE_COMMIT" \
            --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/notes.txt" \
            $PRERELEASE \
            --assets artifacts

      # cargo-dist's generated body repeats an Install/Download/checksum block
      # for every package. GitHub already lists the artifacts, so replace the
      # body with the changelog section for this version. When there is no
      # changelog section, leave cargo-dist's body in place.
      - name: "Trim release notes to the changelog"
        # Skipped when the publish step accepted a complete release it could not
        # rewrite (read-only token): there is nothing to edit, and attempting it
        # would only turn a usable release red.
        if: ${{ steps.publish.outputs.writable == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: "${{ needs.plan.outputs.tag }}"
        run: |
          VERSION="${TAG#v}"
          bash infra/scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/release-notes.txt"
          if [ -s "$RUNNER_TEMP/release-notes.txt" ]; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.txt"
          else
            echo "no changelog section"
          fi

  # The package bumps below only need a PUBLISHED release whose client assets
  # are complete: they read the sha256 digests from the release with
  # `gh release view`. Before this job they required needs.host.result ==
  # 'success', so ANY later host failure skipped every bump - on 2026-11-16
  # the failing publish step did exactly that even after the release existed,
  # and the packaging manifests had to be bumped by hand (bdae448).
  #
  # This job checks the release itself: published, and carrying every asset the
  # packaging steps read, so the bumps run whenever the release exists and
  # never before its assets exist. `always()` is what lets a red host job not
  # hide a complete release.
  release-state:
    needs:
      - plan
      - host
    if: ${{ always() && ((github.event_name == 'push' && needs.plan.outputs.publishing == 'true' && needs.plan.outputs.tag != '') || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_bumps == 'true' && github.event.inputs.tag != '')) }}
    runs-on: "ubuntu-22.04"
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.state.outputs.ready }}
      tag: ${{ github.event_name == 'push' && needs.plan.outputs.tag || github.event.inputs.tag }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # `gh release view` refuses to run outside a git repository; this job has
      # no checkout (it reads only release metadata), so name the repo
      # explicitly. Without it the gate always reported ready=false and every
      # packaging bump was silently skipped (found on the v1.11.1 tag).
      GH_REPO: ${{ github.repository }}
    steps:
      # The bumps read their sha256 values from the release, and the winget
      # publisher needs the MSI. Those six assets are the gate: a release that
      # is published and carries them can be packaged; anything less (a failed
      # or partial publish) keeps the bumps skipped. This check reads only the
      # release metadata, so it adds no artifact egress (the 2026-11-16 failure
      # window also hit an artifact-egress 503).
      - name: Check the published release has the assets the packaging steps read
        id: state
        shell: bash
        env:
          TAG: "${{ github.event_name == 'push' && needs.plan.outputs.tag || github.event.inputs.tag }}"
        run: |
          set -euo pipefail
          skip() { printf '::warning::%s\n' "$1"; printf 'ready=false\n' >> "$GITHUB_OUTPUT"; exit 0; }
          notice_skip() { printf '::notice::%s\n' "$1"; printf 'ready=false\n' >> "$GITHUB_OUTPUT"; exit 0; }
          if [ -z "${TAG:-}" ]; then
            notice_skip "no tag on this run; package bumps stay skipped"
          fi
          if ! gh release view "$TAG" --json isDraft,url,assets > state.json 2>state.err; then
            notice_skip "$TAG has no readable release ($(head -1 state.err)); package bumps stay skipped"
          fi
          if [ "$(jq -r '.isDraft' state.json)" = "true" ]; then
            skip "the release for $TAG is still a draft; package bumps stay skipped"
          fi
          jq -r '.assets[].name' state.json > got.txt
          missing=''
          for name in \
            lightspeed-client-x86_64-pc-windows-msvc.zip \
            lightspeed-client-x86_64-apple-darwin.tar.xz \
            lightspeed-client-aarch64-apple-darwin.tar.xz \
            lightspeed-client-x86_64-unknown-linux-gnu.tar.xz \
            lightspeed-client-aarch64-unknown-linux-gnu.tar.xz \
            lightspeed-gui-x86_64-pc-windows-msvc.msi
          do
            if ! grep -Fxq -- "$name" got.txt; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            printf '::warning::the release for %s is missing these assets; package bumps stay skipped:%s\n' "$TAG" "$missing"
            printf 'ready=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '::notice::the release for %s is published with %s assets, including every asset the packaging steps read; package bumps may run\n' "$TAG" "$(jq '.assets | length' state.json)"
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"
      - name: Report the release state
        shell: bash
        run: |
          echo "release-state: ready=${{ steps.state.outputs.ready }} for tag ${{ github.event_name == 'push' && needs.plan.outputs.tag || github.event.inputs.tag }}"

  # Homebrew is tapped straight from this repo (no separate tap repository), so
  # each release must move Formula/lightspeed.rb to the new version and sums.
  # Committing it here keeps `brew install` current without a manual step.
  bump-homebrew:
    needs:
      - release-state
    # Gated on the published release, not on host success (see release-state).
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_bumps == 'true')) && needs.release-state.outputs.ready == 'true' }}
    # The three bump jobs all commit to master, so they must not run at the same
    # time. `needs` chains them instead of a concurrency group: the group kept
    # cancelling bump-chocolatey (a queued job in a group loses its slot when a
    # newer job in the same group appears), which left the nuspec on the
    # previous version on both v1.9.0 and v1.10.0.
    permissions:
      contents: write
    runs-on: "ubuntu-22.04"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - name: Bump the Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.release-state.outputs.tag }}"; VERSION="${VERSION#v}"
          bash infra/scripts/bump-homebrew.sh "$VERSION"
          if git diff --quiet -- Formula/lightspeed.rb; then
            echo "formula already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/lightspeed.rb
          git commit -m "chore(homebrew): bump to v${VERSION}"
          git push origin HEAD:master

  # The Chocolatey package pins a release URL and sha256 inside the install
  # script, so each tag must move dist/chocolatey to the new version and sums,
  # then PUSH the built .nupkg to the community feed. Both halves live here so
  # a release cannot leave the feed behind again: before this step existed the
  # bump ran (sources stayed current) but nothing pushed, so the feed served
  # 1.6.3 while the repo shipped 1.6.14.
  #
  # CHOCO_API_KEY is a Chocolatey Community API key (account shibbityshwab).
  # Pushes are moderated, so a freshly pushed version stays unlisted until a
  # moderator approves it - that is normal and not a failure.
  bump-chocolatey:
    needs:
      - release-state
      - bump-homebrew
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_bumps == 'true')) && needs.release-state.outputs.ready == 'true' }}
    permissions:
      contents: write
    runs-on: "ubuntu-22.04"
    env:
      CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - name: Bump the Chocolatey package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.release-state.outputs.tag }}"; VERSION="${VERSION#v}"
          bash infra/scripts/bump-chocolatey.sh "$VERSION"
          if git diff --quiet -- dist/chocolatey; then
            echo "package already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/chocolatey
          git commit -m "chore(chocolatey): bump to v${VERSION}"
          git push origin HEAD:master

      - name: Push the .nupkg to the community feed
        # Gated on the secret so a fork or a repo without it still builds; the
        # bump above is the part every checkout needs.
        if: ${{ env.CHOCO_API_KEY != '' }}
        run: |
          VERSION="${{ needs.release-state.outputs.tag }}"; VERSION="${VERSION#v}"
          bash dist/chocolatey/build.sh
          nupkg="dist/chocolatey/lightspeed.${VERSION}.nupkg"
          [ -f "$nupkg" ] || nupkg="$(ls dist/chocolatey/lightspeed.*.nupkg | head -1)"
          echo "pushing $nupkg"
          curl -fsS -X PUT \
            -H "X-NuGet-ApiKey: ${CHOCO_API_KEY}" \
            --data-binary "@${nupkg}" \
            https://push.chocolatey.org/api/v2/package/ \
            -o /dev/null -w 'push HTTP %{http_code}\n'

      - name: Note the secret is absent
        if: ${{ env.CHOCO_API_KEY == '' }}
        run: echo "::notice::CHOCO_API_KEY is not set; the package source was bumped but not pushed to the community feed."

  # The Scoop bucket (ShibbityShwab/scoop-bucket) is what `scoop install
  # lightspeed` reads. Before this job the bucket held the only copy of the
  # manifest and nothing updated it, so it stayed at 1.6.3 for eleven releases.
  # dist/scoop now holds the source of truth and is bumped here; publishing it
  # to the bucket is a separate step needing a token with write access to that
  # repo (see dist/scoop/README.md).
  bump-scoop:
    needs:
      - release-state
      - bump-chocolatey
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_bumps == 'true')) && needs.release-state.outputs.ready == 'true' }}
    permissions:
      contents: write
    runs-on: "ubuntu-22.04"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - name: Bump the Scoop manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.release-state.outputs.tag }}"; VERSION="${VERSION#v}"
          bash infra/scripts/bump-scoop.sh "$VERSION"
          if git diff --quiet -- dist/scoop; then
            echo "manifest already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/scoop
          git commit -m "chore(scoop): bump to v${VERSION}"
          git push origin HEAD:master


  # The Scoop bucket (ShibbityShwab/scoop-bucket) is what `scoop install
  # lightspeed` reads, and it is a SEPARATE public repository. dist/scoop is
  # the source of truth and bump-scoop committed the tag's manifest to master
  # above; this job publishes that copy to the bucket through the GitHub
  # contents API (infra/scripts/publish-scoop.sh).
  #
  # SCOOP_TOKEN is a token with "Contents: write" on ShibbityShwab/scoop-bucket.
  # A missing secret is a clean skip (the notice names it); a broken publish is
  # red, and --version makes a stale master manifest red instead of silently
  # publishing the previous version. See docs/publishing-channels.md.
  publish-scoop:
    needs:
      - release-state
      - bump-scoop
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_bumps == 'true')) && needs.release-state.outputs.ready == 'true' }}
    runs-on: "ubuntu-22.04"
    permissions:
      contents: read
    env:
      # secrets.* cannot be read inside an `if:`, so mirror it and gate the step.
      SCOOP_TOKEN: ${{ secrets.SCOOP_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - name: Publish the Scoop manifest to ShibbityShwab/scoop-bucket
        if: ${{ env.SCOOP_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.SCOOP_TOKEN }}
          VERSION: ${{ needs.release-state.outputs.tag }}
        run: |
          set -euo pipefail
          # --version: refuse to publish a bucket manifest that is not at this
          # tag, so a failed or skipped bump-scoop is visible instead of
          # shipping the previous version to `scoop install` users.
          bash infra/scripts/publish-scoop.sh --version "${VERSION#v}"
      - name: Note the secret is absent
        if: ${{ env.SCOOP_TOKEN == '' }}
        run: echo "::notice::SCOOP_TOKEN is not set; the Scoop bucket was not updated for ${GITHUB_REF_NAME}. Add a token with the Contents-write permission on ShibbityShwab/scoop-bucket (see docs/publishing-channels.md)."

  # The AUR package (lightspeed-bin, dist/aur) has never been published: the
  # AUR repository is empty and the name is free. The FIRST push needs an AUR
  # account with an SSH key registered - an owner action, not something CI can
  # create (see dist/aur/README.md). After that, AUR_SSH_PRIVATE_KEY (the
  # matching private key) lets this job publish through
  # infra/scripts/publish-aur.sh. A missing secret is a clean skip; a broken
  # publish, or a PKGBUILD that was not bumped to this tag, is red.
  publish-aur:
    needs:
      - release-state
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_bumps == 'true')) && needs.release-state.outputs.ready == 'true' }}
    runs-on: "ubuntu-22.04"
    permissions:
      contents: read
    env:
      # secrets.* cannot be read inside an `if:`, so mirror it and gate the step.
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - name: Note the secret is absent
        if: ${{ env.AUR_SSH_PRIVATE_KEY == '' }}
        run: echo "::notice::AUR_SSH_PRIVATE_KEY is not set; the AUR package was not published. The first push needs an AUR account with an SSH key registered - see docs/publishing-channels.md."
      - name: Install the AUR SSH key and pin aur.archlinux.org's host key
        if: ${{ env.AUR_SSH_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/aur_ssh_key"
          printf '%s' "$AUR_SSH_PRIVATE_KEY" > "$key"
          # ssh wants the private key file to end with a newline; a secret is
          # normally stored without a trailing one.
          if [ "$(tail -c 1 "$key" | od -An -tx1 | tr -d ' \n')" != "0a" ]; then
            printf '\n' >> "$key"
          fi
          chmod 600 "$key"
          known_hosts="$RUNNER_TEMP/aur_known_hosts"
          ssh-keyscan -t ed25519,rsa aur.archlinux.org > "$known_hosts" 2>/dev/null
          [ -s "$known_hosts" ] || { echo "::error::ssh-keyscan returned no host keys for aur.archlinux.org"; exit 1; }
          {
            echo "GIT_SSH_COMMAND=ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts"
          } >> "$GITHUB_ENV"
      - name: Publish the AUR package
        if: ${{ env.AUR_SSH_PRIVATE_KEY != '' }}
        env:
          VERSION: ${{ needs.release-state.outputs.tag }}
        run: |
          set -euo pipefail
          # --version: a PKGBUILD that was not bumped to this tag is a red job
          # (bump it, then re-run) rather than a stale AUR publish.
          bash infra/scripts/publish-aur.sh --version "${VERSION#v}"


  announce:
    needs:
      - plan
      - host
    # use "always() && ..." to allow us to wait for all publish jobs while
    # still allowing individual publish jobs to skip themselves (for prereleases).
    # "host" however must run to completion, no skipping allowed!
    if: ${{ always() && needs.host.result == 'success' }}
    runs-on: "ubuntu-22.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # secrets.* cannot be read inside an `if:`, so gate on the env var instead.
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Post release announcement to Discord
        if: ${{ env.DISCORD_WEBHOOK != '' }}
        env:
          RELEASE_TAG: ${{ needs.release-state.outputs.tag }}
          RELEASE_URL: https://github.com/ShibbityShwab/lightspeed/releases/tag/${{ needs.release-state.outputs.tag }}
        run: |
          PAYLOAD=$(cat <<EOF
          {
            "content": "A new LightSpeed release is out: **$RELEASE_TAG**",
            "embeds": [
              {
                "title": "LightSpeed $RELEASE_TAG",
                "description": "Reduce your ping. Free. Forever. Download the latest LightSpeed release for Windows, Linux, or macOS.",
                "url": "$RELEASE_URL"
              }
            ]
          }
          EOF
          )
          curl -sS -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK"

  # Manual addition (not cargo-dist generated): publish the Windows GUI MSI to
  # the Windows Package Manager via winget-releaser on each tag-push release.
  # It is gated on `release-state` (the release exists with every built asset,
  # including the MSI) instead of on host success, because on 1.11.0 the host
  # job was red at the publish step while the release existed and this publisher
  # was skipped. winget-releaser reads assets + the tag directly from GitHub.
  #
  # No-op when unconfigured: secrets cannot be read inside an `if:`, so
  # WINGET_TOKEN is mirrored into a job-level env var and the step is gated on
  # it, the same idiom the Discord step in `announce` uses. Until a WINGET_TOKEN
  # secret exists (see dist/winget/README.md: a fine-grained PAT on
  # microsoft/winget-pkgs with "Pull requests: write" and "Contents: read"), the
  # step is skipped and this job exits 0.
  winget-releaser:
    needs:
      - release-state
    # Gated on the published release rather than on host success: on 1.11.0 the
    # host job was red at the publish step while the release existed, and this
    # publisher must still run (it is a clean no-op without WINGET_TOKEN and
    # while the package is not bootstrapped).
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_bumps == 'true')) && needs.release-state.outputs.ready == 'true' }}
    runs-on: "ubuntu-22.04"
    # The package has never been bootstrapped in microsoft/winget-pkgs, and
    # winget-releaser cannot create the first version. A pre-check below skips
    # the publish until the first manifest exists; continue-on-error stays as a
    # belt-and-braces guard so this optional publisher never fails a release.
    continue-on-error: true
    env:
      # secrets.* cannot be read inside an `if:`, so gate on the env var instead.
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - name: Check whether the winget package exists
        id: winget_pkg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api repos/microsoft/winget-pkgs/contents/manifests/s/ShibbityShwab/LightSpeed >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ShibbityShwab.LightSpeed is not bootstrapped in microsoft/winget-pkgs yet; skipping the winget publish until the first manifest is submitted."
          fi

      - name: Publish LightSpeed to Windows Package Manager (winget)
        if: ${{ env.WINGET_TOKEN != '' && steps.winget_pkg.outputs.exists == 'true' }}
        # vedantmgoyal9/winget-releaser: repo was renamed from
        # vedantmgoyal2009/winget-releaser (the old name still redirects).
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: ShibbityShwab.LightSpeed
          token: ${{ secrets.WINGET_TOKEN }}

  # A release is not done until every package manifest points at the new
  # version. On v1.9.0 the chocolatey bump was cancelled by the bump
  # concurrency group while two runs overlapped: the tag and the GitHub
  # Release were fine, but the nuspec stayed on the previous version and the
  # feed was never pushed. This turns that silent drift into a red release.
  verify-bumps:
    needs:
      - release-state
      - bump-homebrew
      - bump-chocolatey
      - bump-scoop
    # Only meaningful once the release (and therefore the bumps) could run.
    if: ${{ always() && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_bumps == 'true')) && needs.release-state.outputs.ready == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master

      - name: Verify every package manifest matches the tag
        shell: bash
        run: |
          set -uo pipefail
          VERSION="${{ needs.release-state.outputs.tag }}"; VERSION="${VERSION#v}"
          fail=0
          for attempt in 1 2 3 4 5 6; do
            git pull --ff-only origin master || true
            fail=0
            grep -q "version \"$VERSION\"" Formula/lightspeed.rb || fail=1
            grep -q "<version>$VERSION</version>" dist/chocolatey/lightspeed.nuspec || fail=1
            grep -q "releases/download/v$VERSION/" dist/chocolatey/tools/chocolateyInstall.ps1 || fail=1
            grep -q "\"version\": \"$VERSION\"" dist/scoop/lightspeed.json || fail=1
            [ "$fail" -eq 0 ] && break
            sleep 20
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::a package manifest is still not at $VERSION after the bump jobs"
            grep -n "version" Formula/lightspeed.rb | head -3 || true
            grep -n "<version>" dist/chocolatey/lightspeed.nuspec | head -3 || true
            grep -n '"version"' dist/scoop/lightspeed.json | head -3 || true
            exit 1
          fi
          echo "all package manifests are at $VERSION"

  # The publish path only runs on a tag push, so nothing would exercise it on a
  # PR. This job runs its hermetic self-test on every event - including
  # pull_request - with gh stubbed out: no token, no network, no release. It is
  # the PR-runnable verification that the idempotent create / --clobber upload /
  # bounded retry / permission verdict logic is not broken by a workflow change.
  release-publish-self-test:
    name: Release publish self-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release publish self-test
        run: bash infra/scripts/test_release_publish.sh

  # The two channel publishers above only execute on a tag push with the
  # matching secret, so a PR could break them and nothing would notice until a
  # release. These hermetic self-tests run on every event: a stateful gh stub
  # for the Scoop contents-API write and a file:// bare repository for the AUR
  # push. No token, no network, no real package repository.
  publishing-self-test:
    name: Publishing channels self-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scoop bucket publish self-test
        run: bash infra/scripts/test_publish_scoop.sh
      - name: AUR publish self-test
        run: bash infra/scripts/test_publish_aur.sh

  # Read-only probe for a workflow_dispatch. It cannot publish: `plan` runs
  # `dist plan` only on a dispatch, `publishing` is false, and the build/host
  # jobs are skipped. It reports the token/repository state and what the publish
  # step would do for the `tag` input, without running a mutating gh command -
  # the safe way to check a fix (and to run the self-test) on a branch.
  release-probe:
    name: Release publish probe (read-only)
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_bumps != 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROBE_TAG: "${{ github.event.inputs.tag }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report the token and repository state
        run: |
          set -uo pipefail
          echo "## Release publish probe"
          echo ""
          echo "- actor: ${GITHUB_ACTOR}"
          echo "- repository: ${GITHUB_REPOSITORY}"
          echo "- ref: ${GITHUB_REF}"
          echo "- this job's token: contents: read; the publish job asks for contents: write"
          echo "- repository workflow-permission default: $(gh api "/repos/${GITHUB_REPOSITORY}/actions/permissions/workflow" --jq '.default_workflow_permissions' 2>/dev/null || echo 'not readable with this token')"
          echo "- token repository permissions: $(gh api "/repos/${GITHUB_REPOSITORY}" --jq '.permissions' 2>/dev/null | tr -d '\n' || echo 'not readable with this token')"
          echo ""
          echo "This probe never creates, edits, or uploads a release."
      - name: Show what the publish step would do
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${PROBE_TAG:-}" ]; then
            echo "::notice::no tag input; the publish dry run was skipped"
            exit 0
          fi
          echo "### Dry run for ${PROBE_TAG}"
          bash infra/scripts/publish-release.sh --dry-run --tag "$PROBE_TAG"
