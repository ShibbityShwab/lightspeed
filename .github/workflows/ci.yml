name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --exclude lightspeed-gui

      - name: Build
        run: cargo build --release --workspace --exclude lightspeed-gui

      - name: Test
        run: cargo test --workspace --exclude lightspeed-gui

  proxy-quic-smoke:
    name: Proxy QUIC Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      # Exercises the release artifact, which unit tests do not: a missing
      # `--features quic` or an ambiguous rustls provider passes `cargo test`
      # and only fails when the shipped binary actually starts.
      - name: Release QUIC control-plane smoke
        run: bash infra/scripts/test_proxy_quic_smoke.sh

  deploy-canary-tests:
    name: Deploy Canary Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pure bash: sources deploy.sh and drives the canary selection, batch
      # ordering, verification gate, and rollback paths with function doubles.
      # No cargo, no SSH, no network.
      - name: Canary rollout self-test
        run: bash infra/scripts/test_deploy_canary.sh

  infra-script-tests:
    name: Infra Script Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # These suites existed but no workflow ever invoked them, so they could
      # only rot: a change to collect-metrics.sh, the region recommender, the
      # egress guard, or append-history.sh shipped unverified. Each runs
      # offline against local fixtures (bash + curl + jq reading file:// URLs),
      # so they need no services, no secrets, and no network.
      #
      # Deliberately NOT run here, with the reason:
      #   test_handoff_e2e.sh    requires Linux + root; it drives a real relay
      #                          in-place exec and cannot run in a plain job.
      #   test_relay_updater.sh  requires flock and Unix file-mode semantics;
      #                          it is exercised on the relay hosts themselves.
      #   test_relay_install.sh  asserts Unix ownership/mode outcomes (0711
      #                          runtime dir) that a container job cannot honor.
      # Those three stay covered by their own host-level runs; adding them here
      # would produce false reds rather than signal.
      - name: Metrics collector self-test
        run: bash infra/scripts/test_collect_metrics.sh

      - name: Region recommender self-test
        run: bash infra/scripts/test_recommend_regions.sh

      - name: Egress budget self-test
        run: bash infra/scripts/test_egress_budget.sh

      - name: Inventory self-test
        run: bash infra/scripts/test_inventory.sh

      - name: History appender self-test
        timeout-minutes: 5
        run: bash infra/scripts/test_append_history.sh

      - name: Mesh analyzer self-test
        run: bash infra/scripts/test_analyze_mesh.sh

      - name: Package bump self-test
        run: bash infra/scripts/test_bump_packages.sh

      - name: Scoop bump self-test
        run: bash infra/scripts/test_bump_scoop.sh

      - name: Node inventory self-test
        run: bash infra/scripts/test_lib_nodes.sh

      - name: Geo catalog self-test
        run: bash infra/scripts/test_geo_catalogs.sh

  web-locale-checks:
    name: Web Localization Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Both modes existed with no workflow invoking them, so the catalog and
      # the eight generated pages could drift from web/index.html unnoticed -
      # which is how a page shipped with relative asset URLs that 404 from
      # /<tag>/ and with tag fragments left in its text.
      - name: Catalog matches the source page
        run: bash scripts/extract-web-strings.sh --check

      - name: Generated locale pages are current
        run: bash scripts/generate-web-locales.sh --check

  macos-smoke:
    name: macOS Smoke Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --workspace --exclude lightspeed-gui

      - name: Lib tests
        run: cargo test --workspace --lib --exclude lightspeed-gui

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: |
          cargo llvm-cov \
            --workspace \
            --exclude lightspeed-gui \
            --no-clean \
            --lcov \
            --output-path lcov.info

      - name: Print coverage summary
        run: cargo llvm-cov --no-run --workspace --exclude lightspeed-gui

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14

  windows-test:
    name: Windows Build & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --workspace --exclude lightspeed-gui

      - name: Test
        run: cargo test --workspace --lib --exclude lightspeed-gui

  windows-gui:
    name: Windows GUI Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Build GUI (release)
        run: cargo build --release -p lightspeed-gui

      # The GUI crate is excluded from every clippy invocation elsewhere
      # (`--exclude lightspeed-gui` in the Linux jobs). Without this step it is
      # built and tested but never LINTED - which is how three lints
      # (a manual RangeInclusive::contains and two map_or_identity) accumulated
      # unseen until a local toolchain finally ran clippy on it.
      - name: Clippy GUI
        run: cargo clippy -p lightspeed-gui --all-targets

      - name: Test GUI
        run: cargo test -p lightspeed-gui

  benchmarks:
    name: Benchmark Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install critcmp
        uses: taiki-e/install-action@v2
        with:
          tool: critcmp

      - name: Run benchmarks (report only)
        run: cargo bench --workspace --exclude lightspeed-gui

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: target/criterion/
          retention-days: 7
          if-no-files-found: warn

  feature-matrix:
    name: Feature Matrix (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - "quic"
          - "full"
          - "ml"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Build (${{ matrix.features }})
        run: cargo build --release --workspace --exclude lightspeed-gui --features ${{ matrix.features }}

      - name: Test (${{ matrix.features }})
        run: cargo test --workspace --lib --exclude lightspeed-gui --features ${{ matrix.features }}

      - name: Clippy (${{ matrix.features }})
        run: cargo clippy --workspace --exclude lightspeed-gui --features ${{ matrix.features }}

  e2e-test:
    name: End-to-End Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Build proxy and client
        run: cargo build --workspace --exclude lightspeed-gui

      - name: Start manual proxy and echo server
        run: |
          python3 -c "
          import socket, threading, time, struct
          def echo():
              s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)
              s.bind(('127.0.0.1',9999))
              while True:
                  d,a=s.recvfrom(2048)
                  s.sendto(d,a)
          threading.Thread(target=echo,daemon=True).start()
          time.sleep(0.1)
          print('echo ready')
          " &
          sleep 1
          echo "Proxy and echo server ready"