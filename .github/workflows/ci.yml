name: CI

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --exclude lightspeed-gui

      - name: Build
        run: cargo build --release --workspace --exclude lightspeed-gui

      - name: Test
        run: cargo test --workspace --exclude lightspeed-gui

  # Six integration suites are gated with `#![cfg(feature = "quic")]`:
  # proxy/tests/integration_control.rs, proxy/tests/phase0_integration.rs,
  # client/tests/control_reconnect.rs, client/tests/phase0_reconnect.rs,
  # client/tests/quic_telemetry_capability.rs, client/tests/register_destination.rs.
  # `proxy`'s dev-dependency on `lightspeed-client` turns the client's `quic`
  # feature on in workspace test builds (feature unification), so the `Test`
  # step in Check & Test and Code Coverage build these suites too; the Feature
  # Matrix still passes `--lib`, which excludes every `tests/` target. The job
  # keeps their explicit `--tests` pass separate from the large jobs so it
  # can't hide behind, or be hidden by, their status.
  quic-integration-tests:
    name: QUIC Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # The evidence this gate is worth is the per-suite line: each of the six
      # suites must print `test result: ok. N passed` with N > 0. `--no-fail-fast`
      # changes reporting only (every test binary still runs to completion); a
      # failure still fails the job, and no existing gate is modified.
      - name: QUIC-gated integration suites
        run: cargo test -p lightspeed-client -p lightspeed-proxy --features quic --tests --no-fail-fast

  proxy-quic-smoke:
    name: Proxy QUIC Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      # Exercises the release artifact, which unit tests do not: a missing
      # `--features quic` or an ambiguous rustls provider passes `cargo test`
      # and only fails when the shipped binary actually starts.
      - name: Release QUIC control-plane smoke
        run: bash infra/scripts/test_proxy_quic_smoke.sh

  deploy-canary-tests:
    name: Deploy Canary Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pure bash: sources deploy.sh and drives the canary selection, batch
      # ordering, verification gate, and rollback paths with function doubles.
      # No cargo, no SSH, no network.
      - name: Canary rollout self-test
        run: bash infra/scripts/test_deploy_canary.sh

  infra-script-tests:
    name: Infra Script Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # These suites existed but no workflow ever invoked them, so they could
      # only rot: a change to collect-metrics.sh, the region recommender, the
      # egress guard, or append-history.sh shipped unverified. Each runs
      # offline against local fixtures (bash + curl + jq reading file:// URLs),
      # so they need no services, no secrets, and no network.
      #
      # Deliberately NOT run here, with the reason:
      #   test_handoff_e2e.sh    requires Linux + root; it drives a real relay
      #                          in-place exec and cannot run in a plain job.
      #   test_relay_updater.sh  requires flock and Unix file-mode semantics;
      #                          it is exercised on the relay hosts themselves.
      #   test_relay_install.sh  asserts Unix ownership/mode outcomes (0711
      #                          runtime dir) that a container job cannot honor.
      # Those three stay covered by their own host-level runs; adding them here
      # would produce false reds rather than signal.
      - name: Metrics collector self-test
        run: bash infra/scripts/test_collect_metrics.sh

      - name: Region recommender self-test
        run: bash infra/scripts/test_recommend_regions.sh

      - name: Egress budget self-test
        run: bash infra/scripts/test_egress_budget.sh

      - name: Inventory self-test
        run: bash infra/scripts/test_inventory.sh

      - name: History appender self-test
        timeout-minutes: 5
        run: bash infra/scripts/test_append_history.sh

      - name: Mesh analyzer self-test
        run: bash infra/scripts/test_analyze_mesh.sh

      - name: Package bump self-test
        run: bash infra/scripts/test_bump_packages.sh

      - name: Scoop bump self-test
        run: bash infra/scripts/test_bump_scoop.sh

      - name: Node inventory self-test
        run: bash infra/scripts/test_lib_nodes.sh

      - name: Geo catalog self-test
        run: bash infra/scripts/test_geo_catalogs.sh

      # The anomaly monitor's own self-test (674 lines, 100+ assertions) only
      # ran inside the scheduled workflow, so a PR could change the detector or
      # its severity gate and the first execution was the live schedule.
      - name: Anomaly detector self-test
        run: bash infra/scripts/test_health_anomaly.sh

      # The WF-067 control_alpn flip tooling (infra/scripts/relay-control-alpn.sh)
      # is the fleet-rollout path for the versioned ALPN, and it is mostly
      # fail-closed/rollback branches that no local run reaches. Its offline
      # suite drives the real script with ssh/curl/systemctl/proxy stubs against
      # a temp config (no network, no relay), so a broken rollback is caught here
      # rather than on a live relay.
      - name: Relay control_alpn flip self-test
        run: bash infra/scripts/test_relay_control_alpn.sh

      # The Release workflow's publish step only runs on a tag push, so the
      # idempotent-create / --clobber / bounded-retry / permission-verdict
      # paths would otherwise first execute on a real release. The suite drives
      # infra/scripts/publish-release.sh with a stateful gh stub (no token, no
      # network, no release).
      - name: Release publish self-test
        timeout-minutes: 5
        run: bash infra/scripts/test_release_publish.sh

      # The tag-push-only channel publishers (Scoop bucket, AUR) are driven by
      # hermetic stateful-stub suites so a broken publisher cannot first execute
      # on a real release.
      - name: Scoop publish self-test
        timeout-minutes: 5
        run: bash infra/scripts/test_publish_scoop.sh

      - name: AUR publish self-test
        timeout-minutes: 5
        run: bash infra/scripts/test_publish_aur.sh

  localization-checks:
    name: Localization Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Both web modes existed with no workflow invoking them, so the catalog and
      # the eight generated pages could drift from web/index.html unnoticed -
      # which is how a page shipped with relative asset URLs that 404 from
      # /<tag>/ and with tag fragments left in its text.
      - name: Catalog matches the source page
        run: python scripts/extract_web_strings.py --check

      - name: Generated locale pages are current
        run: python scripts/generate_web_locales.py --check

      # Every translated doc must carry the unreviewed-translation warning: a
      # reader landing straight on docs/faq.ja.md from a search result otherwise
      # saw an assertion about anti-cheat behaviour with no hint that no native
      # speaker had read it.
      - name: Translated docs carry the unreviewed banner
        run: python scripts/localized-docs.py --check

      # Same idea, one level down: a catalog key or doc page whose English moved
      # and whose translation did not is drift even when every string is present.
      # Fix it with the Localization workflow, which translates and commits.
      - name: Translations match their English source
        run: python scripts/localization-sync.py --check

  macos-smoke:
    name: macOS Smoke Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build (release)
        run: cargo build --release --workspace --exclude lightspeed-gui

      - name: Lib tests
        run: cargo test --workspace --lib --exclude lightspeed-gui

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: |
          cargo llvm-cov \
            --workspace \
            --exclude lightspeed-gui \
            --no-clean \
            --lcov \
            --output-path lcov.info

      - name: Print coverage summary
        run: cargo llvm-cov --no-run --workspace --exclude lightspeed-gui

      - name: Upload coverage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          retention-days: 14

  windows-test:
    name: Windows Build & Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build (release)
        run: cargo build --release --workspace --exclude lightspeed-gui

      # Every other clippy step runs on Linux, where `#[cfg(windows)]` code is
      # compiled out; the GUI job lints only the GUI crate. Without this step
      # the Windows interceptor, WinDivert handle and Windows socket paths were
      # built and tested but never linted. Use the shipped feature set rather
      # than --all-features: `pcap-capture` needs the Npcap SDK, which this job
      # does not install.
      - name: Clippy (Windows-specific code)
        run: |
          cargo clippy -p lightspeed-client --features quic,windivert-redirect --all-targets
          cargo clippy -p lightspeed-proxy --features quic --all-targets

      - name: Test
        run: cargo test --workspace --lib --exclude lightspeed-gui

      # The Windows WinDivert tests are `#[cfg(windows, feature = "windivert-redirect")]`.
      # Without this step they are only linted, never executed.
      - name: Test (WinDivert feature)
        run: cargo test -p lightspeed-client --features quic,windivert-redirect --lib

  windows-gui:
    name: Windows GUI Build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build GUI (release)
        run: cargo build --release -p lightspeed-gui

      # The GUI crate is excluded from every clippy invocation elsewhere
      # (`--exclude lightspeed-gui` in the Linux jobs). Without this step it is
      # built and tested but never LINTED - which is how three lints
      # (a manual RangeInclusive::contains and two map_or_identity) accumulated
      # unseen until a local toolchain finally ran clippy on it.
      - name: Clippy GUI
        run: cargo clippy -p lightspeed-gui --all-targets

      - name: Test GUI
        run: cargo test -p lightspeed-gui

  # ── WF-081 W2-4 GUI parity: Linux + macOS ─────────────────────────────────
  # Mirror the `windows-gui` gate above. The GUI crate is excluded from every
  # Linux clippy/build invocation (`--exclude lightspeed-gui`), so before these
  # jobs its Linux/macOS builds were only exercised by the release matrix.
  # Design ask: docs/design/cross-platform-2026.md §6.1; acceptance:
  # docs/design/gui-refresh-spec.md §5 W2-4 (a). The Linux system packages are
  # the set `dist-workspace.toml` already proves sufficient for the release
  # build, plus `libssl-dev` (reqwest's native-tls -> OpenSSL on Linux).
  #
  # Per-OS counts are part of the evidence, and the two `cfg(not(windows))`
  # single-instance tests (client-gui/src/single_instance.rs) are hard-asserted:
  # a Linux/macOS run that silently tests a shorter list must fail the job.
  linux-gui:
    name: Linux GUI Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install GUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libgtk-3-dev libssl-dev

      - name: Build GUI
        run: cargo build -p lightspeed-gui

      - name: Clippy GUI
        run: cargo clippy -p lightspeed-gui --all-targets

      - name: Test GUI (per-OS counts)
        run: |
          set -o pipefail
          set +e
          cargo test -p lightspeed-gui 2>&1 | tee gui-test-linux.log
          status=${PIPESTATUS[0]}
          set -e

          echo "### Linux GUI test counts" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^test result:' gui-test-linux.log | sed 's/^/  /' >> "$GITHUB_STEP_SUMMARY" || true
          echo "  - non-Windows single-instance tests (must appear below):" >> "$GITHUB_STEP_SUMMARY"

          for test_name in lock_file_guard_excludes_second_instance lock_file_guard_creates_parent_directory; do
            if grep -qE "^test single_instance::tests::${test_name} \.\.\. ok" gui-test-linux.log; then
              echo "[linux-gui] ${test_name}: ok"
              echo "  - \`${test_name}\`: ok" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::[linux-gui] non-Windows single-instance test ${test_name} did not run"
              exit 1
            fi
          done

          if ! grep -qE '^test result: ok\.' gui-test-linux.log; then
            echo "::error::[linux-gui] cargo test printed no 'test result: ok.' line"
            exit 1
          fi

          echo "[linux-gui] cargo test exit=${status}"
          exit "$status"

  macos-gui:
    name: macOS GUI Build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build GUI
        run: cargo build -p lightspeed-gui

      - name: Clippy GUI
        run: cargo clippy -p lightspeed-gui --all-targets

      - name: Test GUI (per-OS counts)
        run: |
          set -o pipefail
          set +e
          cargo test -p lightspeed-gui 2>&1 | tee gui-test-macos.log
          status=${PIPESTATUS[0]}
          set -e

          echo "### macOS GUI test counts" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^test result:' gui-test-macos.log | sed 's/^/  /' >> "$GITHUB_STEP_SUMMARY" || true
          echo "  - non-Windows single-instance tests (must appear below):" >> "$GITHUB_STEP_SUMMARY"

          for test_name in lock_file_guard_excludes_second_instance lock_file_guard_creates_parent_directory; do
            if grep -qE "^test single_instance::tests::${test_name} \.\.\. ok" gui-test-macos.log; then
              echo "[macos-gui] ${test_name}: ok"
              echo "  - \`${test_name}\`: ok" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::[macos-gui] non-Windows single-instance test ${test_name} did not run"
              exit 1
            fi
          done

          if ! grep -qE '^test result: ok\.' gui-test-macos.log; then
            echo "::error::[macos-gui] cargo test printed no 'test result: ok.' line"
            exit 1
          fi

          echo "[macos-gui] cargo test exit=${status}"
          exit "$status"

      # Advisory only: hosted macOS runners are headless but normally carry an
      # Aqua session, and there is no xvfb/xdotool equivalent - the probe is the
      # app's own trace log. With the G0.2 hook (`LIGHTSPEED_GUI_SMOKE=1`) both
      # markers must appear (`GUI_SMOKE window_created title="LightSpeed"` +
      # `GUI_SMOKE exit=0`) and the process must exit 0; before the hook lands
      # the pre-hook fallback is the `app created` startup line. Unproven until a
      # run proves it (docs/design/cross-platform-2026.md §6.2); keep it
      # advisory, never make it a blocking gate, never delete it silently.
      # WF-081b task-81 (QA C2/C5/C6): the hook markers, `frames>=1`, exit 0 and
      # "the probe did not kill the app" are all required; a killed run (143)
      # FAILS and there is no log-only pre-hook pass in smoke mode.
      - name: Headless smoke (advisory; unproven on hosted macOS)
        continue-on-error: true
        env:
          LIGHTSPEED_GUI_SMOKE: "1"
        run: |
          log="$HOME/Library/Application Support/Lightspeed/gui-trace.log"
          window_marker='GUI_SMOKE window_created title="LightSpeed"'
          rm -f "$log"
          ./target/debug/lightspeed-gui &
          app=$!
          window_seen=0
          exit_seen=0
          i=0
          while [ "$i" -lt 150 ]; do
            i=$((i + 1))
            sleep 0.2
            if grep -qF "$window_marker" "$log" 2>/dev/null; then
              window_seen=1
            fi
            if grep -qF 'GUI_SMOKE exit=0' "$log" 2>/dev/null; then
              exit_seen=1
            fi
            kill -0 "$app" 2>/dev/null || break
            if [ "$window_seen" -eq 1 ] && [ "$exit_seen" -eq 1 ]; then
              break
            fi
          done
          i=0
          while [ "$i" -lt 75 ] && kill -0 "$app" 2>/dev/null; do
            i=$((i + 1))
            sleep 0.2
          done
          terminated=0
          if kill -0 "$app" 2>/dev/null; then
            terminated=1
            kill "$app" 2>/dev/null || true
          fi
          status=0
          wait "$app" 2>/dev/null || status=$?
          # Re-read after the exit: the hook can win the race against the poll.
          if grep -qF "$window_marker" "$log" 2>/dev/null; then
            window_seen=1
          fi
          if grep -qF 'GUI_SMOKE exit=0' "$log" 2>/dev/null; then
            exit_seen=1
          fi
          frames=$(sed -n 's/.*GUI_SMOKE exit=0 frames=\([0-9][0-9]*\).*/\1/p' "$log" 2>/dev/null | tail -n 1)
          frames=${frames:-0}
          echo "macOS headless smoke: window=${window_seen} exit_marker=${exit_seen} frames=${frames} terminated=${terminated} app_exit=${status}"
          if [ "$terminated" -ne 0 ] || [ "$status" -eq 143 ]; then
            echo "::error::macOS headless smoke: the run was killed (exit=${status}); the G0.2 hook must exit 0 by itself"
            exit 1
          fi
          if [ "$window_seen" -ne 1 ] || [ "$exit_seen" -ne 1 ] || [ "$frames" -lt 1 ] || [ "$status" -ne 0 ]; then
            echo "::error::macOS headless smoke: G0.2 markers/clean exit not observed (window=${window_seen} exit_marker=${exit_seen} frames=${frames} app_exit=${status})"
            exit 1
          fi
          echo "macOS headless smoke: G0.2 window + clean self-exit observed in ${log}"

  # ── Headless GUI smoke (required) ─────────────────────────────────────────
  # W2-4 (b): prove a real window is created on a display-less runner. Invocation
  # is the documented one (docs/design/cross-platform-2026.md §6.1): xvfb-run
  # with software GL (`glow` renderer + llvmpipe), a bounded run, and the
  # probe in `scripts/headless-gui-smoke.sh`:
  #   * G0.2 hook path (`LIGHTSPEED_GUI_SMOKE=1`, `desktop-platform` task-61):
  #     require BOTH log markers `GUI_SMOKE window_created title="LightSpeed"`
  #     and `GUI_SMOKE exit=0 frames=<n>` plus the process's exit 0 - no xdotool
  #     needed, the window closes itself after ~2 frames.
  #   * pre-hook fallback: the documented xdotool `^LightSpeed$` title probe
  #     (§6.2) plus the existing `app created` trace line.
  #
  # PROMOTED 2026-11-21: the probe passed 10 consecutive genuine master runs
  # (all six decision controls in --self-check, real window proved by PID +
  # geometry; the pre-fix runs that were job-green while failing are excluded).
  # Both steps below are blocking; never make them advisory again silently.
  # Cost: a standard GitHub-hosted runner, no paid service ($0.00).
  gui-headless-smoke:
    name: Headless GUI Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install GUI + headless system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libgl1-mesa-dev libgl1-mesa-dri libgtk-3-dev libssl-dev xvfb xdotool


      - name: Build GUI (debug)
        run: cargo build -p lightspeed-gui

      - name: Headless smoke probe self-check (decision controls)
        run: bash scripts/headless-gui-smoke.sh --self-check

      - name: Headless window smoke
        run: |
          timeout 120 xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            bash scripts/headless-gui-smoke.sh ./target/debug/lightspeed-gui

  feature-matrix:
    name: Feature Matrix (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        features:
          - "quic"
          - "full"
          - "ml"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Build (${{ matrix.features }})
        run: cargo build --release --workspace --exclude lightspeed-gui --features ${{ matrix.features }}

      - name: Test (${{ matrix.features }})
        run: cargo test --workspace --lib --exclude lightspeed-gui --features ${{ matrix.features }}

      - name: Clippy (${{ matrix.features }})
        run: cargo clippy --workspace --exclude lightspeed-gui --features ${{ matrix.features }}

  e2e-test:
    name: End-to-End Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev

      - name: Build proxy and client
        run: cargo build --workspace --exclude lightspeed-gui

      - name: Start manual proxy and echo server
        run: |
          python3 -c "
          import socket, threading, time, struct
          def echo():
              s=socket.socket(socket.AF_INET,socket.SOCK_DGRAM)
              s.bind(('127.0.0.1',9999))
              while True:
                  d,a=s.recvfrom(2048)
                  s.sendto(d,a)
          threading.Thread(target=echo,daemon=True).start()
          time.sleep(0.1)
          print('echo ready')
          " &
          sleep 1
          echo "Proxy and echo server ready"