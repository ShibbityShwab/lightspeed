name: Deploy Proxy

on:
  push:
    branches: [ master ]
    paths:
      - 'proxy/**'
      - 'protocol/**'
      # The deploy builds the CLI client as its control-plane probe
      # (`lightspeed --features quic`, see lightspeed_resolve_probe in
      # infra/scripts/deploy.sh) and the canary gate refuses to deploy if that
      # probe cannot register. A client-only fix (for example the rustls
      # provider change) therefore changes the deploy's own verification path
      # and must retrigger a deploy, or the fix never reaches production.
      # Scoped to client/** only: client-gui is not part of the probe.
      - 'client/**'
      - 'infra/scripts/deploy.sh'
      - 'infra/scripts/relay-install.sh'
      - 'infra/scripts/relay-updater.sh'
      - 'infra/scripts/lib-nodes.sh'
  workflow_dispatch:
    # A dispatch with control_alpn_node set runs ONLY the single-relay
    # control_alpn flip job, never a fleet deploy; a dispatch without it is a
    # normal deploy. Push events never flip, and a flip never redeploys.
    inputs:
      control_alpn_node:
        description: 'Relay node id, region, or IP to flip. Leave empty for a normal deploy dispatch.'
        required: false
        default: ''
        type: string
      # A string, not a choice: the dispatch API rejected the choice default
      # ("Provided value 'off' ... not in the list of allowed values"), and the
      # script validates off|required itself, so the typed enum buys nothing.
      control_alpn_mode:
        description: 'Target [network] control_alpn mode: off or required.'
        required: false
        default: 'off'
        type: string
      control_alpn_confirm:
        description: 'Must type exactly: flip <node> <mode> (fails closed otherwise).'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    # A normal push or a dispatch without a node; a flip dispatch must not
    # redeploy the fleet, so it skips this job entirely.
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.control_alpn_node }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.100.0
          targets: x86_64-unknown-linux-gnu

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libpcap-dev

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/lightspeed_deploy
          chmod 600 ~/.ssh/lightspeed_deploy

      - name: Build and Deploy Proxy
        run: |
          chmod +x infra/scripts/deploy.sh
          ./infra/scripts/deploy.sh

  control-alpn-flip:
    name: control_alpn flip
    # Single relay, dispatch only, and mutually exclusive with the deploy job:
    # a normal dispatch/push never changes a relay config, and a flip dispatch
    # never redeploys the fleet.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.control_alpn_node != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The confirm string is the zero-cost guard against a stray dispatch:
      # the operator has to type the exact node and mode they mean.
      - name: Validate the flip confirmation
        env:
          NODE: ${{ inputs.control_alpn_node }}
          MODE: ${{ inputs.control_alpn_mode }}
          CONFIRM: ${{ inputs.control_alpn_confirm }}
        run: |
          expected="flip ${NODE} ${MODE}"
          if [ "${CONFIRM}" != "${expected}" ]; then
            echo "::error::control_alpn_confirm must be exactly '${expected}' (got '${CONFIRM}')"
            exit 1
          fi

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/lightspeed_deploy
          chmod 600 ~/.ssh/lightspeed_deploy

      - name: Flip one relay's control_alpn
        env:
          NODE: ${{ inputs.control_alpn_node }}
          MODE: ${{ inputs.control_alpn_mode }}
        run: |
          chmod +x infra/scripts/relay-control-alpn.sh
          ./infra/scripts/relay-control-alpn.sh --node "${NODE}" --mode "${MODE}"
