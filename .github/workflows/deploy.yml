name: Deploy Proxy

on:
  push:
    branches: [ master ]
    paths:
      - 'proxy/**'
      - 'protocol/**'
      # The deploy builds the CLI client as its control-plane probe
      # (`lightspeed --features quic`, see lightspeed_resolve_probe in
      # infra/scripts/deploy.sh) and the canary gate refuses to deploy if that
      # probe cannot register. A client-only fix (for example the rustls
      # provider change) therefore changes the deploy's own verification path
      # and must retrigger a deploy, or the fix never reaches production.
      # Scoped to client/** only: client-gui is not part of the probe.
      - 'client/**'
      - 'infra/scripts/deploy.sh'
      - 'infra/scripts/relay-install.sh'
      - 'infra/scripts/relay-updater.sh'
      - 'infra/scripts/lib-nodes.sh'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libpcap-dev

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/lightspeed_deploy
          chmod 600 ~/.ssh/lightspeed_deploy

      - name: Build and Deploy Proxy
        run: |
          chmod +x infra/scripts/deploy.sh
          ./infra/scripts/deploy.sh
