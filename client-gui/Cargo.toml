[package]
name = "lightspeed-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "LightSpeed Windows tray icon + egui status window"

[[bin]]
name = "lightspeed-gui"
path = "src/main.rs"

[dependencies]
lightspeed-client = { path = "../client", features = ["quic", "windivert-redirect"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
anyhow = { workspace = true }
dirs = "6.0"
eframe = { version = "0.36", features = ["default"] }
egui_plot = "0.37"
webbrowser = "1"

# Windows-only: the real system tray (tray-icon) plus WinDivert support.
# tray-icon is Windows-only because the Linux/macOS tray backends are stubs
# that never use it; keeping it global pulled gtk -> glib 0.18 into the
# Linux build, triggering GHSA-wrw7-89jp-8q8g.
[target.'cfg(windows)'.dependencies]
tray-icon = "0.24.1"
windivert = { version = "0.6", optional = true, features = ["vendored"] }

# Override lightspeed-client features on Windows
[target.'cfg(windows)'.dependencies.lightspeed-client]
path = "../client"
features = ["quic", "windivert-redirect"]

# cargo-dist: the GUI has no macOS platform module, so restrict its release
# targets to Linux and Windows (the client + proxy still ship for macOS).
[package.metadata.dist]
# macOS is UNTESTED — the platform backend compiles but has not been run on
# real macOS hardware.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
installers = ["msi", "shell"]
# Bundle the WinDivert DLL + signed kernel driver next to the GUI exe (Windows).
include = ["../client/windivert/WinDivert.dll", "../client/windivert/WinDivert64.sys", "../client/windivert/LICENSE.windivert"]

[package.metadata.wix]
upgrade-guid = "41D817A3-8271-4718-B962-EC50BAAF4D99"
path-guid = "30C41895-8B6B-4E34-A4A3-8B43865072EA"
license = false
eula = false
