[package]
name = "lightspeed-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "LightSpeed Windows tray icon + egui status window"

[[bin]]
name = "lightspeed-gui"
path = "src/main.rs"

[dependencies]
lightspeed-client = { path = "../client", features = ["quic", "windivert-redirect"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
anyhow = { workspace = true }
axoupdater = "0.10.2"
dirs = "7.0"
# GUI config persistence (config.rs) and relay /health parsing (discovery.rs).
serde_json = { workspace = true }
toml = { workspace = true }
# The GUI's tree enables both rustls providers (ring via the client's QUIC
# stack, aws-lc-rs via reqwest/axoupdater), which makes rustls's automatic
# provider selection panic on the first QUIC call. main.rs pins `ring`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
eframe = { version = "0.36", features = ["default", "glow"] }
egui_plot = "0.37"
# Decode the embedded brand PNGs at runtime: the window/taskbar icon
# (main.rs) and the in-app header mark (app.rs). PNG only, no default
# features, so this adds no extra decoders to the build.
image = { version = "0.25", default-features = false, features = ["png"] }
# axoupdater pulls reqwest with default-features = false and no TLS backend, so
# HTTPS calls (GitHub releases API) would fail at runtime. Enable native-tls so
# the tree's single reqwest instance can actually talk TLS: schannel on Windows,
# Security.framework on macOS, OpenSSL on Linux.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json"] }
# sha256 verification of the downloaded update archive (self_update.rs).
sha2 = "0.10"
webbrowser = "1"

# Build-time icon embedding: build.rs renders the brand PNG into a multi-size
# ICO and compiles it into the exe, which is the only way Windows will show the
# brand mark on the taskbar button and in Explorer. The `ico` codec lives here
# rather than on the runtime dep above so the shipped binary carries no
# encoder it never calls. Unconditional rather than target-conditional: build
# scripts compile for the BUILD HOST, and a `target.'cfg(windows)'` dependency
# is only passed to the script when the build TARGET is Windows - so the first
# Linux/macOS build host (the cargo-dist release matrix) failed with E0433
# `cannot find crate image`. The script's own runtime target check still
# keeps the work Windows-only.
[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

# Windows-only: the real system tray (tray-icon) plus WinDivert support.
# tray-icon is Windows-only because the Linux/macOS tray backends are stubs
# that never use it; keeping it global pulled gtk -> glib 0.18 into the
# Linux build, triggering GHSA-wrw7-89jp-8q8g.
[target.'cfg(windows)'.dependencies]
tray-icon = "0.26.0"
windivert = { version = "0.7.0-beta.4", optional = true, features = ["vendored"] }

# Override lightspeed-client features on Windows
[target.'cfg(windows)'.dependencies.lightspeed-client]
path = "../client"
features = ["quic", "windivert-redirect"]

# cargo-dist: the GUI has no macOS platform module, so restrict its release
# targets to Linux and Windows (the client + proxy still ship for macOS).
[package.metadata.dist]
# macOS is UNTESTED — the platform backend compiles but has not been run on
# real macOS hardware.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
installers = ["msi", "shell"]
# Bundle the WinDivert DLL + signed kernel driver next to the GUI exe (Windows).
include = ["../client/windivert/WinDivert.dll", "../client/windivert/WinDivert64.sys", "../client/windivert/LICENSE.windivert"]

[package.metadata.wix]
upgrade-guid = "41D817A3-8271-4718-B962-EC50BAAF4D99"
path-guid = "30C41895-8B6B-4E34-A4A3-8B43865072EA"
license = false
eula = false
