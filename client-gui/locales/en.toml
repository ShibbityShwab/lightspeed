# LightSpeed GUI - source locale (English).
#
# This file is the source of truth: every user-visible string in the GUI lives
# here, and every other locale is a translation of this key set. Keys are
# dotted and grouped by the screen that renders them.
#
# The key set must be identical across catalogs, which
# `every_shipped_locale_matches_the_source_key_set` enforces - the source locale
# (`en.toml`) is the authority on which keys exist.
#
# Rules for translators (and for the tests in src/i18n.rs):
#   - Keep keys identical across files; translate values only.
#   - `{name}` placeholders must survive; they are substituted at render time.
#   - Use "..." (three ASCII dots) where the source does; the GUI renders the
#     ellipsis itself.

